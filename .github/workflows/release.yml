name: Release Multi-Platform Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build and upload Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Folia v__VERSION__"
          releaseBody: |
            ## Folia v__VERSION__

            轻量简洁、零隐藏数据库的跨平台 Markdown 笔记工作台。

            ### 本次更新要点 (v0.1.1)
            - **本地编辑版本历史**：默认每 5 分钟自动记录去重快照（存放在应用数据目录，零笔记库污染），支持 Diff 对比、预览与一键恢复。
            - **分笔记库 / 分文件夹独立排序与手动自由排序**：支持 5 种排序模式逐级继承（图标标识）、同级拖拽调序与右键上下移，重启自动记忆。
            - **双链断链提示与重命名引用同步**：失效双链实时虚线提示；重命名文件时按需检测并弹窗询问是否同步更新 `[[双链]]` 与相对路径链接。
            - **编辑效率增强**：选中文本自动包裹 Markdown 语法、VS Code 风格列编辑/多光标、单实例运行与系统托盘、窗口/标签页/分栏状态持久化、居中页面排版、源码图片悬浮预览。
            - **Markdown 渲染与代码高亮升级**：完整修复嵌套行内语法（如 `**...\`code\`...**`）外层符号残留；代码块全面切换为 CodeMirror/Lezer 真实多语言高亮（120+ 语言 + Makefile）；支持脚注、行内 HTML、多行 Callout、缩略语、标题锚点 `{#id}` 跳转与 YAML Frontmatter 高亮。
            - **性能、体积与细节优化**：Windows 单文件体积精简至 < 9 MB；多笔记库改为精准局部刷新并忽略常见编译缓存目录；多线程全文搜索提速；修复 Mermaid/块级组件点击偏移、深色主题光标及附件栏未自动刷新问题；搜索筛选项字号加大、刷新按钮移入笔记库右键菜单。

            完整更新记录见仓库 [CHANGELOG.md](https://github.com/harry10086/Folia/blob/main/CHANGELOG.md)。

            ### 下载说明
            - **Windows (x64)**：
              - 便携版（免安装解压即用，配置保存在程序目录 `data/`）：下载 `Folia___VERSION___x64-portable.zip`
              - 安装版：下载 `.exe`（NSIS 安装包）或 `.msi`
              > Folia.exe 同级目录有 portable.txt：启用便携模式，自动在 .exe 同级生成并读写 data/
              > Folia.exe 同级目录没有 portable.txt：自动读写 %APPDATA%\Folia
            - **macOS**：Apple Silicon（M1/M2/M3/M4）下载 `aarch64.dmg`；Intel 芯片下载 `x64.dmg`
            - **Linux (x64)**：下载 `.AppImage`、`.deb` 或 `.rpm`

            ### 开源信息
            - 作者：harry ([mianao.info](https://mianao.info))
            - 协议：GPLv3
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package and upload Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "v$ver"
          $stageDir = "Folia_${ver}_x64-portable"
          $zipName = "${stageDir}.zip"

          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "src-tauri\target\release\folia.exe" "$stageDir\Folia.exe"
          if (Test-Path "src-tauri\target\release\WebView2Loader.dll") {
            Copy-Item "src-tauri\target\release\WebView2Loader.dll" "$stageDir\"
          }
          Copy-Item "LICENSE" "$stageDir\LICENSE"
          "Folia Portable Mode Marker`r`nKeep this file next to Folia.exe to store configuration and crash-recovery drafts in ./data instead of %APPDATA%\Folia." | Set-Content -Path "$stageDir\portable.txt" -Encoding UTF8

          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipName -Force
          gh release upload $tag $zipName --clobber
