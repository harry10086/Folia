name: Release Multi-Platform Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build and upload Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Folia v__VERSION__"
          releaseBody: |
            ## Folia v__VERSION__

            轻量、本地文件夹优先、零隐藏数据库的跨平台 Markdown 笔记工作台。

            ### 下载说明
            - **Windows (x64)**：
              - 便携版（免安装解压即用，配置保存在程序目录 `data/`）：下载 `Folia___VERSION___x64-portable.zip`
              - 安装版：下载 `.exe`（NSIS 安装包）或 `.msi`
            - **macOS**：Apple Silicon（M1/M2/M3/M4）下载 `aarch64.dmg`；Intel 芯片下载 `x64.dmg`
            - **Linux (x64)**：下载 `.AppImage`、`.deb` 或 `.rpm`

            ### 开源信息
            - 作者：harry ([mianao.info](https://mianao.info))
            - 协议：GPLv3
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package and upload Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "v$ver"
          $stageDir = "Folia_${ver}_x64-portable"
          $zipName = "${stageDir}.zip"

          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "src-tauri\target\release\folia.exe" "$stageDir\Folia.exe"
          if (Test-Path "src-tauri\target\release\WebView2Loader.dll") {
            Copy-Item "src-tauri\target\release\WebView2Loader.dll" "$stageDir\"
          }
          Copy-Item "LICENSE" "$stageDir\LICENSE"
          "Folia Portable Mode Marker`r`nKeep this file next to Folia.exe to store configuration and crash-recovery drafts in ./data instead of %APPDATA%\Folia." | Set-Content -Path "$stageDir\portable.txt" -Encoding UTF8

          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipName -Force
          gh release upload $tag $zipName --clobber
